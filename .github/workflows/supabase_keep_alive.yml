name: Supabase Database Keep-Alive Cron

on:
  schedule:
    # Runs automatically every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUP_URL="${SUPABASE_URL:-https://idrhzigiaewgtqexfgbj.supabase.co}"
          echo "Sending keep-alive ping to Supabase endpoint..."
          curl -s -X GET "${SUP_URL}/rest/v1/crag_audit_logs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo -e "\n[SUCCESS] Supabase Keep-Alive Ping Executed Successfully!"
